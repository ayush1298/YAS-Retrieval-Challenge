[project]
name = "solution"
version = "0.1.0"
description = "Layout-aware hybrid retrieval over 1954 Arabic government pages (YAS retrieval challenge)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "sentence-transformers>=4.0",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
solution = "solution.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
